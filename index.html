<!DOCTYPE html>
<html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form with Bootstrap</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@7.12.15/dist/sweetalert2.all.min.js"></script>
    
  </head>
  <body class="bg-light">
    <div class="container">
      <div class="form-container">
        <h4 class="text-center mb-4">Form Submission to Google Sheet</h4>
        <form id="submit-to-google-sheet">
          <div class="form-group">
            <label for="name">First and Last Name:</label>
            <input class="form-control" type="text" name="first_last_name" id="name" placeholder="Name" required="">
          </div>
          <div class="form-group">
            <label for="email">Email:</label>
            <input class="form-control" type="email" name="email" id="email" placeholder="Email" required="">
          </div>
          <div class="form-group">
            <label for="slip">Age:</label>
            <input class="form-control" type="number" name="age" id="age" placeholder="Age" required="">
          </div>

          <div class="form-group">
            <label for="loc">Gender:</label>
            <select class="form-control" name="gender" id="gender" required="">
              <option value="" disabled="" selected="" hidden="">Choose...</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
              <option value="non">I do not identify as either</option>
            </select>
          </div>
          <div class="form-group">
            <label for="slip">Grade:</label>
            <input class="form-control" type="text" name="grade" id="grade" placeholder="Grade" required="">
          </div>
          <div class="form-group form-check mt-2">
            <input class="form-check-input" type="checkbox" id="advanced">
            <label class="form-check-label" for="advanced">I am in some sort of advanced curriculum.</label>
          </div>
          <button type="submit" class="btn btn-primary btn-block">
            Submit
          </button>
        
      </div></form>
    </div>

    
  

</div></body></html>
<style>
.form-container {
        max-width: 500px;
        margin: auto;
        margin-top: 50px;
        padding: 20px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        background-color: #fff;
      }
</style>
<script>
const scriptURL = "https://script.google.com/macros/s/AKfycbw3WFndI5TXRubLfDryuZ7N57yVc9C_2GZTMe5tzfGa0iKcYNu7bJ-Z3o9m3-PrUX2S2A/exec";
      const form = document.forms["submit-to-google-sheet"];
      form.addEventListener("submit", (e) => {
        e.preventDefault();
        var formData = new FormData(form);
        var advanced = document.getElementById("advanced").checked;

        if (advanced) {
          formData.append("advanced", "Yes");
        } else {
          formData.append("advanced", "No");
        }

        fetch(scriptURL, { method: "POST", body: formData })
          .then((response) => {
            swal("Done", "Submitted Successfully.", "success");
          })
          .catch((error) => {
            swal("Error", "Something went wrong. please try again!", "error");
          });
      });
</script>
